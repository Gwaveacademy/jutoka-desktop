name: Build & Release Jutoka Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci || npm install

      - name: Package for Windows
        run: npx electron-forge make --platform=win32
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jutoka-desktop-windows
          path: out/make/

  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci || npm install

      - name: Package for macOS (Apple Silicon / arm64)
        run: npx electron-forge make --platform=darwin --arch=arm64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS arm64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jutoka-desktop-macos-arm64
          path: out/make/

      - name: Clean build output
        run: rm -rf out/make

      - name: Package for macOS (Intel / x64)
        run: npx electron-forge make --platform=darwin --arch=x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS x64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jutoka-desktop-macos-x64
          path: out/make/

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: jutoka-desktop-windows
          path: out/windows

      - name: Download macOS arm64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: jutoka-desktop-macos-arm64
          path: out/macos-arm64

      - name: Download macOS x64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: jutoka-desktop-macos-x64
          path: out/macos-x64

      - name: Rename artifacts for clarity
        run: |
          # Rename arm64 artifacts
          cd out/macos-arm64
          find . -name "*.dmg" -exec bash -c 'mv "$0" "$(dirname "$0")/Jutoka-arm64.dmg"' {} \;
          find . -name "*.zip" -exec bash -c 'mv "$0" "$(dirname "$0")/Jutoka-arm64.zip"' {} \;
          
          # Rename x64 artifacts
          cd ../macos-x64
          find . -name "*.dmg" -exec bash -c 'mv "$0" "$(dirname "$0")/Jutoka-x64.dmg"' {} \;
          find . -name "*.zip" -exec bash -c 'mv "$0" "$(dirname "$0")/Jutoka-x64.zip"' {} \;
          
          # List final files
          echo "=== Final release files ==="
          find ../ -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.zip" \) -exec ls -lh {} \;

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name || 'v1.0.0' }}
          name: Jutoka Desktop ${{ github.ref_name || 'v1.0.0' }}
          body: |
            # Jutoka Desktop

            Professional rendering without browser limits.

            ## Downloads
            - **Windows**: Download and run the `.exe` installer
            - **macOS (Apple Silicon / M1/M2/M3/M4)**: Download `Jutoka-arm64.dmg`
            - **macOS (Intel)**: Download `Jutoka-x64.dmg`

            ## Requirements
            - Windows 10/11 64-bit or macOS 12+
            - 8 GB RAM minimum (16 GB recommended for 4K)
            - Internet connection for sign-in and project sync

            ## Installation
            1. Download the installer for your OS
            2. Open the file and follow the prompts
            3. Launch Jutoka Desktop and sign in
            4. Click "Render on Desktop" in any web project

            ## macOS first launch
            Right-click the app in Applications and choose **Open** (don't double-click the first time).
            If you see "Jutoka is damaged" or nothing happens, go to **System Settings → Privacy & Security**
            and click **Open Anyway** next to Jutoka.

            ## Windows first launch
            If you see "Windows protected your PC", click **More info** then **Run anyway**.

            ## Which macOS download do I need?
            - Click the Apple menu → **About This Mac**
            - If it says **Apple M1/M2/M3/M4** → download `Jutoka-arm64.dmg`
            - If it says **Intel** → download `Jutoka-x64.dmg`
          files: |
            out/windows/**/*.exe
            out/macos-arm64/**/Jutoka-arm64.dmg
            out/macos-arm64/**/Jutoka-arm64.zip
            out/macos-x64/**/Jutoka-x64.dmg
            out/macos-x64/**/Jutoka-x64.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
