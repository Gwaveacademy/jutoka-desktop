name: Build & Release Jutoka Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci || npm install

      - name: Package for Windows
        run: npx electron-forge make --platform=win32
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jutoka-desktop-windows
          path: out/make/

  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci || npm install

      # --- arm64 build ---
      - name: Package for macOS (Apple Silicon / arm64)
        run: npx electron-forge make --platform=darwin --arch=arm64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS arm64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jutoka-desktop-macos-arm64
          path: out/make/

      # --- x64 build (cross-compile on same runner via Rosetta 2) ---
      # Do NOT reinstall node_modules with --arch=x64 — that would recompile
      # macos-alias (used by the DMG maker) for x64, which can't be loaded on
      # the arm64 host. Instead, keep arm64 native modules (so DMG maker works)
      # and just tell electron-packager to use the x64 Electron binary.
      # electron-packager downloads the correct arch Electron automatically.
      # We also fetch the x64 ffmpeg-static binary so renders work on Intel.
      - name: Clean build output
        run: rm -rf out/make

      - name: Fetch x64 ffmpeg binary
        run: |
          cd node_modules/ffmpeg-static
          # ffmpeg-static downloads the host-arch binary on install.
          # Replace it with the x64 macOS binary so the packaged app works on Intel.
          npm pack ffmpeg-static -- --target_arch=x64 --target_platform=darwin 2>/dev/null || true
          # Direct download fallback: get the x64 binary from ffmpeg-static's cache
          npx --yes ffmpeg-static@latest -- --arch=x64 2>/dev/null || true
          # If the above didn't work, download directly from the ffmpeg-static release
          node -e "
            const path = require('path');
            const fs = require('fs');
            // ffmpeg-static stores the binary path in index.js
            const ffmpegPath = require('./index.js');
            console.log('Current ffmpeg binary:', ffmpegPath);
            // Check arch
            const { execSync } = require('child_process');
            try {
              const arch = execSync('file ' + ffmpegPath).toString();
              console.log('Arch info:', arch);
              if (arch.includes('x86_64')) {
                console.log('Already x64, no swap needed');
                process.exit(0);
              }
            } catch(e) {}
            // Download x64 binary
            const os = require('os');
            const v = require('./package.json').version;
            const download = require('download');
            const tmpDir = os.tmpdir();
            // ffmpeg-static uses github releases
            const url = 'https://github.com/eugeneware/ffmpeg-static/releases/download/v' + v + '/darwin-x64';
            console.log('Downloading x64 ffmpeg from:', url);
            download(url, tmpDir).then(() => {
              fs.copyFileSync(path.join(tmpDir, 'darwin-x64'), ffmpegPath);
              fs.chmodSync(ffmpegPath, 0o755);
              console.log('Replaced ffmpeg with x64 binary');
            }).catch(err => {
              console.log('Could not download x64 ffmpeg (renders will use Rosetta):', err.message);
              // Not fatal — the app will still open, ffmpeg just runs via Rosetta
            });
          "

      - name: Package for macOS (Intel / x64)
        run: npx electron-forge make --platform=darwin --arch=x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS x64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jutoka-desktop-macos-x64
          path: out/make/

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: jutoka-desktop-windows
          path: out/windows

      - name: Download macOS arm64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: jutoka-desktop-macos-arm64
          path: out/macos-arm64

      - name: Download macOS x64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: jutoka-desktop-macos-x64
          path: out/macos-x64

      - name: Rename x64 artifacts clearly
        run: |
          cd out/macos-x64
          for f in *.dmg; do mv "$f" "Jutoka-x64-${f}"; done 2>/dev/null || true
          for f in *.zip; do mv "$f" "Jutoka-x64-${f}"; done 2>/dev/null || true
          cd ../macos-arm64
          for f in *.dmg; do mv "$f" "Jutoka-arm64-${f}"; done 2>/dev/null || true
          for f in *.zip; do mv "$f" "Jutoka-arm64-${f}"; done 2>/dev/null || true

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name || 'v1.0.0' }}
          name: Jutoka Desktop ${{ github.ref_name || 'v1.0.0' }}
          body: |
            # Jutoka Desktop

            Professional rendering without browser limits.

            ## Downloads
            - **Windows**: Download and run the `.exe` installer
            - **macOS (Apple Silicon / M1/M2/M3/M4)**: Download the `arm64` `.dmg` file
            - **macOS (Intel)**: Download the `x64` `.dmg` file

            ## Requirements
            - Windows 10/11 64-bit or macOS 12+
            - 8 GB RAM minimum (16 GB recommended for 4K)
            - Internet connection for sign-in and project sync

            ## Installation
            1. Download the installer for your OS
            2. Open the file and follow the prompts
            3. Launch Jutoka Desktop and sign in
            4. Click "Render on Desktop" in any web project

            ## macOS first launch
            Right-click the app in Applications and choose **Open** (don't double-click the first time).
            If you see "Jutoka is damaged" or nothing happens, go to **System Settings → Privacy & Security**
            and click **Open Anyway** next to Jutoka.

            ## Windows first launch
            If you see "Windows protected your PC", click **More info** then **Run anyway**.

            ## Which macOS download do I need?
            - Click the Apple menu → **About This Mac**
            - If it says **Apple M1/M2/M3/M4** → download the **arm64** version
            - If it says **Intel** → download the **x64** version
          files: |
            out/windows/**/*.exe
            out/windows/**/*.msi
            out/macos-arm64/**/*.dmg
            out/macos-arm64/**/*.zip
            out/macos-x64/**/*.dmg
            out/macos-x64/**/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
